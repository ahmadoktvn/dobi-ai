services:
  dobi-ai:
    build: .
    container_name: dobi-ai-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Mengarah ke Ollama di host machine pengguna
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
      - PYTHONUNBUFFERED=1
    extra_hosts:
      # Memungkinkan container mengakses localhost host (Ollama)
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount direktori app untuk kemudahan pengembangan (opsional)
      - ./app:/app/app
